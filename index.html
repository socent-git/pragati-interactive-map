<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>the^delta — catalysts for change, by geography</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap');

:root{
  --red:#b21010;
  --slate:#6e7475;
  --dark:#363d3f;
  --yellow:#f4c024;
  --light:#f0f0f0;
  --red-1:#ed7f7f;
  --red-2:#eb4c4c;
  --red-3:#d42f2f;
  --red-4:#c21f1f;
  --red-5:#b21010;
  --red-6:#a40707;
  --red-7:#900000;
  --red-8:#700000;
  --red-9:#5b0000;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--light);
  font-family:'Nunito Sans', sans-serif;
  font-weight:300;
  color:var(--dark);
}

.wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 24px 40px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid var(--red);
  padding-bottom:14px;
  margin-bottom:14px;
  flex-wrap:nowrap;
  gap:16px;
}

.header-logo{
  height:34px;
  width:auto;
  flex:0 0 auto;
}

.header-center{
  flex:1 1 auto;
  text-align:center;
  min-width:0;
  margin-bottom:22px;
}

h1{
  font-weight:800;
  font-size:26px;
  text-transform:lowercase;
  margin:0;
  color:var(--dark);
  line-height:1.15;
}

.tagline{
  font-family:'Nunito Sans', sans-serif;
  font-style:italic;
  color:var(--red);
  font-size:16px;
  margin:4px 0 0;
}

.main-grid{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:24px;
}

@media (max-width:820px){
  .main-grid{grid-template-columns:1fr;}
}

.map-panel{
  background:#ffffff;
  border:1px solid var(--slate);
  padding:14px;
  position:relative;
}

.popup{
  position:absolute;
  z-index:30;
  background:var(--light);
  color:var(--dark);
  width:240px;
  max-height:260px;
  padding:14px 16px 10px;
  border:2px solid var(--red);
  box-shadow:0 10px 24px rgba(0,0,0,0.18);
  display:none;
}
.popup.visible{ display:block; }
.popup .popup-close{
  position:absolute;
  top:6px;
  right:9px;
  cursor:pointer;
  color:var(--slate);
  font-size:15px;
  font-weight:800;
  line-height:1;
}
.popup h3{
  margin:0 4px 2px 0;
  font-size:15px;
  font-weight:800;
  text-transform:lowercase;
  color:var(--dark);
}
.popup .popup-count{
  font-size:11.5px;
  color:var(--red);
  margin-bottom:8px;
}
.popup .popup-empty{
  font-size:12.5px;
  color:var(--slate);
}
.popup ul{
  list-style:none;
  margin:0;
  padding:0;
  max-height:160px;
  overflow-y:auto;
  border-top:1px solid #d5d5d5;
}
.popup li{
  font-size:12.5px;
  padding:6px 2px;
  border-bottom:1px solid #d5d5d5;
  color:var(--dark);
}
.map-panel-title{
  font-weight:800;
  font-size:13px;
  text-transform:lowercase;
  color:var(--dark);
  margin:0 0 10px 2px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.legend{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--slate);
  font-weight:400;
}

.legend-scale{
  display:flex;
  height:10px;
}
.legend-scale div{width:16px;height:10px;}

svg#india-svg{
  width:100%;
  height:auto;
  display:block;
}

path.state{
  stroke:#ffffff;
  stroke-width:0.6;
  cursor:pointer;
  transition:opacity 0.12s ease;
}
path.state:hover{
  opacity:0.75;
  stroke:var(--red);
  stroke-width:1.1;
}
path.state.active{
  stroke:var(--red);
  stroke-width:1.4;
}
path.state.nodata{
  fill:#ed7f7f;
  fill-opacity:0.3;
}

.side-panel{
  background:var(--light);
  color:var(--dark);
  padding:20px;
  display:flex;
  flex-direction:column;
  min-height:420px;
  border:1px solid var(--slate);
}

.side-panel .eyebrow{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--red);
  font-weight:600;
  margin-bottom:6px;
}

.side-panel h2{
  font-weight:800;
  font-size:22px;
  text-transform:lowercase;
  margin:0 0 4px;
  color:var(--dark);
}

.side-panel .count-line{
  font-size:13px;
  color:var(--slate);
  margin-bottom:14px;
}
.side-panel .count-line strong{
  color:var(--red);
  font-size:15px;
}

.org-list{
  list-style:none;
  margin:0;
  padding:0;
  overflow-y:auto;
  flex:1;
  border-top:1px solid #d5d5d5;
}

.org-list li{
  padding:9px 2px;
  border-bottom:1px solid #d5d5d5;
  font-size:13.5px;
  font-weight:400;
  color:var(--dark);
}

.org-list li em{
  font-style:italic;
  color:var(--slate);
  font-size:0.9em;
}

.popup li em{
  font-style:italic;
  color:var(--slate);
  font-size:0.9em;
}

.org-list li a.org-link, .popup li a.org-link{
  color: var(--red);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}
.org-list li a.org-link:hover, .popup li a.org-link:hover{
  border-bottom-color: var(--red);
}

.placeholder{
  color:var(--slate);
  font-size:13px;
  margin-top:40px;
  text-align:center;
  line-height:1.6;
}
.placeholder .cta{
  display:inline-block;
  margin-top:14px;
  background:var(--red);
  color:#fff;
  font-weight:600;
  font-size:12px;
  padding:8px 16px;
  text-transform:lowercase;
}

.notes{
  margin-top:22px;
  display:grid;
  grid-template-columns:minmax(0, 480px);
  gap:16px;
}

.note-box{
  background:#ffffff;
  border:1px solid var(--slate);
  border-left:4px solid var(--yellow);
  padding:14px 16px;
}
.note-box h3{
  font-size:12px;
  text-transform:lowercase;
  font-weight:800;
  margin:0 0 8px;
  color:var(--dark);
}
.note-box p{
  font-size:12.5px;
  color:var(--slate);
  line-height:1.6;
  margin:0;
}
.note-box p b{color:var(--dark);}
</style>
</head>

: "Arunachal Pradesh", "AS": "Assam", "BR": "Bihar", "CH": "Chandigarh", "CT": "Chhattisgarh", "DD": "Dadra and Nagar Haveli", "DL": "Delhi", "DN": "Daman and Diu", "GA": "Goa", "GJ": "Gujarat", "HP": "Himachal Pradesh", "HR": "Haryana", "JH": "Jharkhand", "JK": "Jammu and Kashmir", "KA": "Karnataka", "KL": "Kerala", "LA": "Ladakh", "LD": "Lakshadweep", "MH": "Maharashtra", "ML": "Meghalaya", "MN": "Manipur", "MP": "Madhya Pradesh", "MZ": "Mizoram", "NL": "Nagaland", "OR": "Odisha", "PB": "Punjab", "PY": "Puducherry", "RJ": "Rajasthan", "SK": "Sikkim", "TG": "Telangana", "TN": "Tamil Nadu", "TR": "Tripura", "UP": "Uttar Pradesh", "UT": "Uttarakhand", "WB": "West Bengal"}, "panIndia": ["Navgurukul", "Vigyanshaala", "I-Stem"], "noGeo": [], "orgUrls": {"Adalat AI": "https://adalat.ai", "Intelehealth": "https://intelehealth.org", "Navgurukul": "https://navgurukul.org", "Rightwalk": "https://rightwalk.org", "TAP": "https://theapprenticeproject.org", "Open Links Foundation": "https://vinoba.in", "I-Saksham": "https://i-saksham.org", "Madhi": "https://madhifoundation.org", "Mantra": "https://mantra4change.org", "Antara": "https://antarafoundation.org", "Vigyanshaala": "https://vigyanshaala.com", "I-Stem": "https://inclusivestem.org", "Saarthi": "https://saarthieducation.org", "F4F": "https://farmersforforests.org"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('map-data').textContent);
const ORG_URLS = DATA.orgUrls || {};

function orgLabel(name){
  const url = ORG_URLS[name];
  const escaped = name.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  if (!url) return escaped;
  return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="org-link">' + escaped + '</a>';
}
const svg = document.getElementById('india-svg');
svg.setAttribute('viewBox', DATA.viewBox);

const stateOrgs = DATA.stateOrgs;
const codeToName = DATA.codeToName;

// build counts and color scale
const counts = {};
let maxCount = 0;
for (const code in stateOrgs){
  counts[code] = stateOrgs[code].length;
  if (counts[code] > maxCount) maxCount = counts[code];
}

// red only, kept to the lighter end of the brand red palette: 1 org, 2 orgs, 3+ orgs
const redScale = ["#ed7f7f","#eb4c4c","#d42f2f"];
function colorFor(code){
  const c = counts[code];
  if (!c) return null; // no data
  return redScale[Math.min(c, redScale.length) - 1];
}

// render paths
const ns = "http://www.w3.org/2000/svg";
let allCodes = Object.keys(DATA.paths);
allCodes.forEach(code => {
  const d = DATA.paths[code];
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", d);
  p.setAttribute("data-code", code);
  const fill = colorFor(code);
  p.classList.add("state");
  if (fill){
    p.setAttribute("fill", fill);
  } else {
    p.classList.add("nodata");
  }
  p.addEventListener("click", (evt) => selectState(code, evt));
  const name = codeToName[code] || code;
  const title = document.createElementNS(ns, "title");
  title.textContent = name + (counts[code] ? " — " + counts[code] + " organisation" + (counts[code]>1?"s":"") : " — no submissions");
  p.appendChild(title);
  svg.appendChild(p);
});

function selectState(code, evt){
  document.querySelectorAll('path.state').forEach(p => p.classList.remove('active'));
  const el = document.querySelector('path.state[data-code="'+code+'"]');
  if (el) el.classList.add('active');

  const name = codeToName[code] || code;
  const localOrgs = stateOrgs[code] || [];
  // pan-India orgs work everywhere, so they belong on every state's list too
  const orgs = localOrgs.concat(DATA.panIndia.filter(o => !localOrgs.includes(o)));

  // update the side panel (useful on wide screens / as a persistent view)
  const panel = document.getElementById('side-panel');
  if (orgs.length === 0){
    panel.innerHTML = '<div class="eyebrow">selected state</div><h2>' + name.toLowerCase() + '</h2>' +
      '<div class="count-line">no submissions reported active work here yet.</div>';
  } else {
    let html = '<div class="eyebrow">selected state</div>' +
      '<h2>' + name.toLowerCase() + '</h2>' +
      '<div class="count-line"><strong>' + orgs.length + '</strong> organisation' + (orgs.length>1?'s':'') + ' working here</div>' +
      '<ul class="org-list">';
    localOrgs.forEach(o => { html += '<li>' + orgLabel(o) + '</li>'; });
    DATA.panIndia.filter(o => !localOrgs.includes(o)).forEach(o => { html += '<li>' + orgLabel(o) + ' <em>(pan-India)</em></li>'; });
    html += '</ul>';
    panel.innerHTML = html;
  }

  // if this came from an actual tap/click, also pop the same info up right where the finger landed
  if (evt) showPopup(code, name, orgs, evt);
}

function showPopup(code, name, orgs, evt){
  const popup = document.getElementById('popup');
  const body = document.getElementById('popup-body');
  const mapPanel = document.querySelector('.map-panel');
  const rect = mapPanel.getBoundingClientRect();

  let html = '<h3>' + name.toLowerCase() + '</h3>';
  if (orgs.length === 0){
    html += '<div class="popup-count">no submissions here yet</div>';
  } else {
    html += '<div class="popup-count">' + orgs.length + ' organisation' + (orgs.length>1?'s':'') + ' working here</div>';
    html += '<ul>';
    orgs.forEach(o => { html += '<li>' + orgLabel(o) + (DATA.panIndia.includes(o) ? ' <em>(pan-India)</em>' : '') + '</li>'; });
    html += '</ul>';
  }
  body.innerHTML = html;

  // position near the tap point, relative to the map panel, clamped so it stays on-screen
  let x = evt.clientX - rect.left + 14;
  let y = evt.clientY - rect.top - 10;
  const popupWidth = 240;
  const popupMaxHeight = 260;
  if (x + popupWidth > rect.width) x = evt.clientX - rect.left - popupWidth - 14;
  if (x < 0) x = 6;
  if (y + popupMaxHeight > rect.height) y = rect.height - popupMaxHeight - 6;
  if (y < 0) y = 6;

  popup.style.left = x + 'px';
  popup.style.top = y + 'px';
  popup.classList.add('visible');
}

document.getElementById('popup-close').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('popup').classList.remove('visible');
});

// tapping anywhere outside the popup / a state closes the popup
document.addEventListener('click', (e) => {
  const popup = document.getElementById('popup');
  if (!popup.classList.contains('visible')) return;
  if (popup.contains(e.target)) return;
  if (e.target.closest && e.target.closest('path.state')) return;
  popup.classList.remove('visible');
});

// find top state and pre-select it
let topCode = null, topCount = -1;
for (const code in counts){ if (counts[code] > topCount){ topCount = counts[code]; topCode = code; } }
if (topCode) selectState(topCode);

// notes
document.getElementById('pan-india-note').innerHTML =
  DATA.panIndia.length + ' organisations described their reach as pan-India, nationwide or spanning multiple countries, so they aren\'t mapped to one state: <b>' +
  DATA.panIndia.join(', ') + '</b>.';
</script>
